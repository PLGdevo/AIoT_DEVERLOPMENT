; PlatformIO Project Configuration File for AIoT Library
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = direct
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep+
lib_deps = 
    WiFi
    WebServer
    DNSServer
    Preferences
    WiFiClientSecure
build_src_filter = 
    -<*>
    +<src/>
    +<examples/01_Telemetry_Stream/01_Telemetry_Stream.cpp>
build_flags = 
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-D DEBUG_COLOR
	-D DEBUG
	-I src
